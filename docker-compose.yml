# Incisive Nova - Orquestación Docker (Docker Agentic Platform)
# Derivado de agent-platform.yaml. Los secretos se inyectan como variables de
# entorno en runtime (Harness Secret Manager en CD, o .env en desarrollo local).

services:
  api-service:
    image: incisive-nova-api:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      STELLAR_NETWORK: testnet
      HORIZON_URL: https://horizon-testnet.stellar.org
      NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
      HOME_DOMAIN: api.incisivenova.internal
      DATABASE_URL: postgresql://incisive_nova:${POSTGRES_PASSWORD}@postgres:5432/incisive_nova
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      SERVER_SIGNING_KEY: ${SERVER_SIGNING_KEY}
      SERVER_PUBLIC_KEY: ${SERVER_PUBLIC_KEY}
      JEV_API_KEY: ${JEV_API_KEY}
      ABROAD_API_KEY: ${ABROAD_API_KEY}
      MCP_SERVER_URL: https://mcp-signer:9090
    depends_on:
      - postgres
      - redis
      - mcp-signer
    networks:
      - incisive-nova-network

  mcp-signer:
    image: incisive-nova-mcp-signer:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile.mcp
    environment:
      KEY_STORAGE_TYPE: hsm
      SIGNATURE_ALGO: ed25519
      JWT_VALIDATION_ENABLED: "true"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      # La semilla de firma se inyecta sólo aquí, en el proceso aislado.
      STELLAR_SECRET_SEED: ${STELLAR_SECRET_SEED}
    volumes:
      - keys:/secure/keys
    networks:
      - incisive-nova-network
    # Servicio aislado: no expone puertos al exterior.
    expose:
      - "9090"

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: incisive_nova
      POSTGRES_USER: incisive_nova
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - incisive-nova-network

  redis:
    image: redis:7-alpine
    networks:
      - incisive-nova-network

  frontend:
    image: incisive-nova-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://api-service:8000
      NEXT_PUBLIC_APP_NAME: "Incisive Nova"
      NEXT_PUBLIC_STELLAR_NETWORK: testnet
    depends_on:
      - api-service
    networks:
      - incisive-nova-network

networks:
  incisive-nova-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
  keys:
    driver: local
