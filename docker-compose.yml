# Incisive Nova - Orquestación Docker (Docker Agentic Platform)
# Derivado de agent-platform.yaml. Los secretos se inyectan como variables de
# entorno en runtime (Harness Secret Manager en CD, o .env en desarrollo local).

services:
  api-service:
    image: incisive-nova-api:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      STELLAR_NETWORK: testnet
      HORIZON_URL: https://horizon-testnet.stellar.org
      NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
      HOME_DOMAIN: api.incisivenova.internal
      DATABASE_URL: postgresql://incisive_nova:${POSTGRES_PASSWORD}@postgres:5432/incisive_nova
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      SERVER_SIGNING_KEY: ${SERVER_SIGNING_KEY}
      SERVER_PUBLIC_KEY: ${SERVER_PUBLIC_KEY}
      JEV_API_KEY: ${JEV_API_KEY}
      ABROAD_API_KEY: ${ABROAD_API_KEY}
      MCP_SERVER_URL: https://mcp-signer:9090
      # Orígenes permitidos para CORS (frontend). Ajustar PUBLIC_HOST a la IP/dominio público.
      CORS_ALLOW_ORIGINS: http://${PUBLIC_HOST:-35.171.19.86}:3000,http://localhost:3000
    depends_on:
      - postgres
      - redis
      # mcp-signer temporalmente deshabilitado hasta implementar el Módulo 3
    networks:
      - incisive-nova-network

  # mcp-signer: deshabilitado hasta implementar src/mcp_server (Módulo 3).
  # Descomentar cuando esté listo.
  # mcp-signer:
  #   image: incisive-nova-mcp-signer:${IMAGE_TAG:-latest}
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile.mcp
  #   environment:
  #     KEY_STORAGE_TYPE: hsm
  #     SIGNATURE_ALGO: ed25519
  #     JWT_VALIDATION_ENABLED: "true"
  #     JWT_SECRET_KEY: ${JWT_SECRET_KEY}
  #     STELLAR_SECRET_SEED: ${STELLAR_SECRET_SEED}
  #   volumes:
  #     - keys:/secure/keys
  #   networks:
  #     - incisive-nova-network
  #   expose:
  #     - "9090"

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: incisive_nova
      POSTGRES_USER: incisive_nova
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - incisive-nova-network

  redis:
    image: redis:7-alpine
    networks:
      - incisive-nova-network

  frontend:
    image: incisive-nova-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* se incrusta en build-time. Debe apuntar a la URL pública
      # del backend (IP del EC2), accesible desde el navegador del usuario.
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://35.171.19.86:8000}
        NEXT_PUBLIC_STELLAR_NETWORK: testnet
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://35.171.19.86:8000}
      NEXT_PUBLIC_APP_NAME: "Incisive Nova"
      # HTTP sin TLS: la cookie de sesión NO debe ser Secure o el navegador
      # no la reenvía y el login entra en bucle. Poner "true" al usar HTTPS.
      COOKIE_SECURE: "false"
      NEXT_PUBLIC_STELLAR_NETWORK: testnet
    depends_on:
      - api-service
    networks:
      - incisive-nova-network

networks:
  incisive-nova-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
  keys:
    driver: local
