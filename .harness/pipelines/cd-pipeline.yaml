pipeline:
  name: Incisive Nova - CD
  identifier: incisive_nova_cd
  projectIdentifier: incisivenova
  orgIdentifier: default
  tags:
    project: incisive-nova
    type: cd
  variables:
    # Token de autenticación con la Docker Agentic Platform. Su valor por
    # defecto se resuelve desde el Harness Secret Manager; el trigger de CD
    # lo sobreescribe con el secreto `docker_agentic_token`.
    - name: DOCKER_AGENTIC_TOKEN
      type: Secret
      description: Token de despliegue en la Docker Agentic Platform
      required: true
      value: docker_agentic_token
    - name: DEPLOY_COMMIT
      type: String
      description: SHA del commit que dispara el despliegue
      required: false
      value: <+input>
  stages:
    # ------------------------------------------------------------------
    # 1. Despliegue a Staging (Docker Agentic Platform)
    #    Custom Stage con pasos ShellScript (CLI). Los Custom Stages no admiten
    #    el step "Run" (exclusivo de CI); usan "ShellScript". Los secretos se
    #    inyectan como environmentVariables en runtime desde el Secret Manager;
    #    nunca aparecen en el YAML ni en logs.
    # ------------------------------------------------------------------
    - stage:
        name: Deploy Staging
        identifier: deploy_staging
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: Deploy Stack to Docker Agentic Platform
                  identifier: deploy_stack_staging
                  timeout: 15m
                  spec:
                    shell: Bash
                    onDelegate: true
                    environmentVariables:
                      - name: DOCKER_AGENTIC_TOKEN
                        type: Secret
                        value: <+pipeline.variables.DOCKER_AGENTIC_TOKEN>
                      - name: STELLAR_SECRET_SEED
                        type: Secret
                        value: stellar_secret_seed
                      - name: SERVER_SIGNING_KEY
                        type: Secret
                        value: server_signing_key
                      - name: SERVER_PUBLIC_KEY
                        type: Secret
                        value: server_public_key
                      - name: JWT_SECRET_KEY
                        type: Secret
                        value: jwt_secret_key
                      - name: JEV_API_KEY
                        type: Secret
                        value: jev_api_key
                      - name: ABROAD_API_KEY
                        type: Secret
                        value: abroad_api_key
                      - name: POSTGRES_PASSWORD
                        type: Secret
                        value: postgres_password
                      - name: IMAGE_TAG
                        type: String
                        value: <+pipeline.sequenceId>
                    source:
                      type: Inline
                      spec:
                        script: |
                          set -euo pipefail
                          # Instalar Docker CLI temporalmente si no existe en el delegado.
                          if ! command -v docker &> /dev/null; then
                            echo "Descargando Docker CLI..."
                            curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-25.0.3.tgz -o docker.tgz
                            tar -xzf docker.tgz
                            # Mover solo el binario principal a una ruta del sistema.
                            mv docker/docker /usr/local/bin/
                            rm -rf docker docker.tgz
                            echo "Docker CLI instalado exitosamente."
                          fi
                          echo "Desplegando Incisive Nova en Docker Agentic Platform (staging)..."
                          # Autenticación con la plataforma vía DOCKER_AGENTIC_TOKEN.
                          # Orquesta el stack definido en agent-platform.yaml.
                          docker compose -f docker-compose.yml pull
                          docker compose -f docker-compose.yml up -d --remove-orphans
                          docker compose -f docker-compose.yml ps
                    outputVariables: []
              - step:
                  type: ShellScript
                  name: Health Check
                  identifier: health_check_staging
                  timeout: 5m
                  spec:
                    shell: Bash
                    onDelegate: true
                    environmentVariables: []
                    source:
                      type: Inline
                      spec:
                        script: |
                          echo "Verificando salud del api-service..."
                          for i in $(seq 1 10); do
                            if curl -fsS http://api-service:8000/health; then
                              echo "api-service saludable"
                              exit 0
                            fi
                            sleep 6
                          done
                          echo "api-service no respondió a tiempo"
                          exit 1
                    outputVariables: []
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: MarkAsFailure
    # ------------------------------------------------------------------
    # 2. Puerta de aprobación manual antes de producción
    # ------------------------------------------------------------------
    - stage:
        name: Approve Production
        identifier: approve_production
        type: Approval
        spec:
          execution:
            steps:
              - step:
                  type: HarnessApproval
                  name: Manual Approval
                  identifier: manual_approval
                  timeout: 1d
                  spec:
                    approvalMessage: |
                      Aprobar el despliegue de Incisive Nova a Producción.
                      Verifica que staging esté saludable y los tests en verde.
                    includePipelineExecutionHistory: true
                    isAutoRejectEnabled: false
                    approvers:
                      userGroups:
                        - _project_all_users
                      minimumCount: 1
                      disallowPipelineExecutor: false
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: MarkAsFailure
    # ------------------------------------------------------------------
    # 3. Despliegue a Producción (Docker Agentic Platform)
    #    Custom Stage con paso ShellScript (CLI), igual que staging.
    # ------------------------------------------------------------------
    - stage:
        name: Deploy Production
        identifier: deploy_production
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: Deploy Stack to Production
                  identifier: deploy_stack_production
                  timeout: 15m
                  spec:
                    shell: Bash
                    onDelegate: true
                    environmentVariables:
                      - name: DOCKER_AGENTIC_TOKEN
                        type: Secret
                        value: <+pipeline.variables.DOCKER_AGENTIC_TOKEN>
                      - name: STELLAR_SECRET_SEED
                        type: Secret
                        value: stellar_secret_seed
                      - name: SERVER_SIGNING_KEY
                        type: Secret
                        value: server_signing_key
                      - name: SERVER_PUBLIC_KEY
                        type: Secret
                        value: server_public_key
                      - name: JWT_SECRET_KEY
                        type: Secret
                        value: jwt_secret_key
                      - name: JEV_API_KEY
                        type: Secret
                        value: jev_api_key
                      - name: ABROAD_API_KEY
                        type: Secret
                        value: abroad_api_key
                      - name: POSTGRES_PASSWORD
                        type: Secret
                        value: postgres_password
                      - name: IMAGE_TAG
                        type: String
                        value: <+pipeline.sequenceId>
                    source:
                      type: Inline
                      spec:
                        script: |
                          set -euo pipefail
                          # Instalar Docker CLI temporalmente si no existe en el delegado.
                          if ! command -v docker &> /dev/null; then
                            echo "Descargando Docker CLI..."
                            curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-25.0.3.tgz -o docker.tgz
                            tar -xzf docker.tgz
                            # Mover solo el binario principal a una ruta del sistema.
                            mv docker/docker /usr/local/bin/
                            rm -rf docker docker.tgz
                            echo "Docker CLI instalado exitosamente."
                          fi
                          echo "Desplegando Incisive Nova en Docker Agentic Platform (producción)..."
                          # Autenticación con la plataforma vía DOCKER_AGENTIC_TOKEN.
                          docker compose -f docker-compose.yml pull
                          docker compose -f docker-compose.yml up -d --remove-orphans
                    outputVariables: []
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: MarkAsFailure
