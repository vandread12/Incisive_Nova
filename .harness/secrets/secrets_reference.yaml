# Referencia de secretos de Incisive Nova (SPEC-01 / SPEC-07)
#
# IMPORTANTE: este archivo NO contiene valores. Documenta los identificadores
# de secretos que deben existir en el Harness Secret Manager. Los valores se
# inyectan en runtime con la expresión <+secrets.getValue("<identifier>")>.
#
# Crear cada secreto en Harness: Project Setup > Secrets > + New Secret > Text.

secrets:
  - identifier: stellar_secret_seed
    name: STELLAR_SECRET_SEED
    description: Semilla de firma Stellar consumida por el MCP signer (S...)
    usedBy:
      - cd-pipeline.yaml (deploy_staging, deploy_production)
    scope: project

  - identifier: server_signing_key
    name: SERVER_SIGNING_KEY
    description: Clave privada del servidor para firmar challenges SEP-10
    usedBy:
      - cd-pipeline.yaml
    scope: project

  - identifier: server_public_key
    name: SERVER_PUBLIC_KEY
    description: Clave pública del servidor SEP-10
    usedBy:
      - cd-pipeline.yaml
    scope: project

  - identifier: jwt_secret_key
    name: JWT_SECRET_KEY
    description: Clave secreta para firmar tokens JWT (SPEC-07)
    usedBy:
      - cd-pipeline.yaml
    scope: project

  - identifier: jev_api_key
    name: JEV_API_KEY
    description: API key del motor de decisión Jev
    usedBy:
      - cd-pipeline.yaml
    scope: project

  - identifier: abroad_api_key
    name: ABROAD_API_KEY
    description: API key de Abroad Protocol (orquestación de rieles fiat)
    usedBy:
      - cd-pipeline.yaml
    scope: project

  - identifier: postgres_password
    name: POSTGRES_PASSWORD
    description: Contraseña de la base de datos PostgreSQL
    usedBy:
      - cd-pipeline.yaml
    scope: project

  - identifier: github_pat
    name: GITHUB_PAT
    description: Token de acceso personal de GitHub para el conector de código
    usedBy:
      - connectors/github_repo.yaml
    scope: project

  - identifier: docker_registry_token
    name: DOCKER_REGISTRY_TOKEN
    description: Credencial del registry Docker para push de imágenes
    usedBy:
      - connectors/docker_registry.yaml
    scope: project

  - identifier: docker_agentic_token
    name: DOCKER_AGENTIC_TOKEN
    description: Token de autenticación/despliegue en la Docker Agentic Platform
    usedBy:
      - triggers/cd-on-push-main.yaml
      - cd-pipeline.yaml (deploy_staging, deploy_production)
    scope: project

  - identifier: docker_hub_token
    name: DOCKER_HUB_TOKEN
    description: Access token de Docker Hub para 'docker login' (evita rate limits en pulls)
    usedBy:
      - cd-pipeline.yaml (deploy_staging, deploy_production)
    scope: project
