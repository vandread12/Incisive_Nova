connector:
  name: Incisive Nova GitHub
  identifier: github_repo
  projectIdentifier: incisive_nova
  orgIdentifier: default
  type: Github
  spec:
    url: https://github.com/incisive-nova/incisive-nova
    validationRepo: incisive-nova
    authentication:
      type: Http
      spec:
        type: UsernameToken
        spec:
          username: <+input>
          # PAT de GitHub gestionado por el Harness Secret Manager.
          tokenRef: github_pat
    apiAccess:
      type: Token
      spec:
        tokenRef: github_pat
    executeOnDelegate: false
    type: Repo
